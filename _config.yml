title: Tajkart Student Hub
lang: en
description: Original subject guides, courses, study support, practical projects, and career preparation for students.
url: "https://shahanishashmi.github.io"
baseurl: "/tajkart-student-hub"
markdown: kramdown
show_downloads: false
permalink: pretty
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
      sitemap: true
      content_origin: original
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - books
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - learning/README.md
  - learning/books/README.md
  - learning/cheatsheets/README.md
  - learning/courses/README.md
  - learning/interactive-tutorials/README.md
  - learning/languages/README.md
  - learning/playgrounds/README.md
  - learning/podcasts-screencasts/README.md
  - learning/problem-sets/README.md
  - learning/subjects/README.md
  - careers/README.md
  - offers/README.md
  - tests
  - examples
kramdown:
  input: GFM
  hard_wrap: false
