name: Build and deploy Tajkart Student Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Validate site routes, metadata, links, and Python examples
        run: python scripts/validate_site.py

      - name: Validate attributed reference candidate inventory
        run: python scripts/import_reference_resources.py --check

      - name: Validate complete reference snapshot manifest and browse facets
        run: python scripts/reference_catalog_audit.py --check

      - name: Check generated question and solution coverage audit
        run: python scripts/solution_coverage.py --check

      - name: Check JavaScript syntax
        run: node --check assets/js/learning-tools.js && node --check assets/js/site.js

      - name: Test search matching, ranking, and discovery filters
        run: node tests/search_test.js

      - name: Test student navigation, routes, and mobile menu
        run: node tests/navigation_test.js

      - name: Test local mastery, planner, and portfolio rules
        run: node tests/learning_tools_test.js

      - name: Test solutions, resource metadata, and SQL examples
        run: python -m unittest discover -s tests -v

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"

      - name: Parse Markdown front matter and YAML inventories
        run: ruby scripts/validate_front_matter.rb

      - name: Install site dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Validate generated routes, search index, and accessibility basics
        run: python scripts/validate_html.py _site

      - name: Validate generated SEO metadata, sitemap, robots, and Search Console file
        run: python scripts/validate_seo.py _site

      - name: Package GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
